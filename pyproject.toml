[project]
name = "video-agent"
version = "0.1.0"
description = "AI video editor agent: clone a video's editing style into a blueprint and apply it to new footage"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",  # PostgreSQL (main database)
    "aiosqlite>=0.20",  # SQLite fallback for tests / no DATABASE_URL
    "redis>=5.0",
    "librosa>=1.0",
    "opencv-python>=4.10,<5",  # same package scenedetect needs; 5.x dropped Haar cascades
    "numpy>=2.0",
    "scenedetect>=0.7",
    "yt-dlp>=2026.10",
    "anthropic>=2.8",
    "openai>=3.0",
    "google-genai>=3.0",
    "httpx>=0.27",
    "onnxruntime>=1.20",  # YOLOX + CLIP
    "tokenizers>=0.20",  # CLIP text prompts
    "pyyaml>=6.0",  # knowledge/techniques.yaml
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
ae = ["py-aep>=0.20"]  # reading After Effects .aep projects (video-agent import-ae)

[project.scripts]
video-agent = "video_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_agent*"]

[tool.setuptools.package-data]
"video_agent.web" = ["static/*"]
"video_agent.knowledge" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
